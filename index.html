<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
      }
      if ('caches' in window) {
        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Tomás Surfer</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#CCFF00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tomás Surfer">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            background: rgba(10, 12, 22, 0.52);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.18);
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        input[type="text"] {
            padding: 15px;
            font-size: 1.2em;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            width: 80%;
            text-align: center;
            background: rgba(255,255,255,0.9);
            outline: none;
            transition: box-shadow 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        button {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            color: #111;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 201, 255, 0.4);
        }

        .character-carousel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 12px;
        }

        .arrow-btn {
            width: 50px !important;
            height: 50px !important;
            border-radius: 50% !important;
            padding: 0 !important;
            font-size: 1.5em !important;
            background: rgba(255,255,255,0.15) !important;
            color: white !important;
            border: 2px solid rgba(255,255,255,0.4) !important;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s !important;
            text-transform: none !important;
            font-weight: normal !important;
            line-height: 50px;
            box-shadow: none !important;
        }
        .arrow-btn:hover {
            background: rgba(255,255,255,0.35) !important;
            transform: scale(1.12) !important;
            box-shadow: 0 3px 12px rgba(255,255,255,0.25) !important;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        .hud-left { display: flex; flex-direction: column; }
        .hud-right { text-align: right; }
        
        .lives { display: flex; gap: 5px; margin-top: 5px; }
        .heart { color: #ff3366; font-size: 1.2em; }

        .instructions {
            margin-top: 20px;
            font-size: 0.9em;
            color: #ccc;
        }
    </style>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="hud" class="hidden">
        <div class="hud-left">
            <span id="hud-alias">Jugador</span>
            <div class="lives" id="hud-lives">
                <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
            </div>
        </div>
        <div class="hud-right">
            <div>Max: <span id="hud-max-score">0</span></div>
            <div>Puntos: <span id="hud-score">0</span></div>
            <div style="color:#ffd700;">Monedas: <span id="hud-coins">0</span></div>
            <div id="hud-monster" class="hidden" style="color:#00ffff; margin-top:5px; font-size:0.8em; text-shadow:1px 1px 2px #000;">Jefe: <span id="hud-monster-life">10</span>★</div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="login-screen" class="screen">
            <h1>Tomás Surfer</h1>
            <input type="text" id="alias-input" placeholder="Ingresa tu Alias" maxlength="12">
            
            <h3>Selecciona tu Corredor</h3>
            <div class="character-carousel">
                <button class="arrow-btn" id="prev-char">&#9664;</button>
                <div id="char-name-display" style="min-width:110px; font-weight:bold; color:white; font-size:1.25em; letter-spacing:1px;">Tomas</div>
                <button class="arrow-btn" id="next-char">&#9654;</button>
            </div>

            <button id="start-btn">Jugar</button>
            
            <div class="instructions">
                <b>Teclado:</b> Flechas para mover/agachar, Espacio para saltar<br>
                <b>Móvil:</b> Desliza (Swipe) Izquierda/Derecha/Arriba/Abajo
            </div>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #ff3b30;">¡Game Over!</h1>
            <h2 id="final-score-display">Puntos: 0</h2>
            <button id="restart-btn" style="margin-top: 20px;">Volver a jugar</button>
        </div>
    <div id="pause-btn" class="hidden" style="position: absolute; bottom: 20px; left: 20px; z-index: 100; font-size: 2em; background: rgba(0,0,0,0.5); color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer; border: 2px solid white; user-select: none;">⏸</div>

    <div id="pause-screen" class="screen hidden" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 200;">
        <h1>PAUSA</h1>
        <button id="resume-btn" style="margin-top: 20px;">Reanudar</button>
    </div>

    <script>
        // --- GAME CONFIG & STATE ---
        const config = {
            laneWidth: 3,
            lanes: [3, 0, -3], // Izquierda visual, Centro, Derecha visual
            speedBase: 15,
            speedMax: 40,
            trainColors: [0xff3b30, 0x007aff, 0xffcc00, 0x8e8e93],
            playerY: 1,
            jumpForce: 25,
            gravity: -50
        };

        const state = {
            isPlaying: false,
            alias: '',
            playerColor: 0xff3b30,
            score: 0,
            scoreWithoutMistakes: 0,
            maxScore: localStorage.getItem('tomasSurferMaxScore') || 0,
            coins: 0,
            lives: 3,
            speed: config.speedBase,
            distance: 0,
            
            playerLane: 1, 
            targetX: 0,
            playerVelocityY: 0,
            isPaused: false,
            isJumping: false,
            isDucking: false,
            duckTimer: 0,
            isInvincible: false,
            invincibleTimer: 0,
            isOnTrain: false,
            groundY: 0,
            monsterActive: false,
            monsterTimer: 0,
            monsterType: 0,
            monsterLife: 0,
            monstersDefeated: 0
        };

        // --- DOM ELEMENTS ---
        const uiLayer = document.getElementById('ui-layer');
        const loginScreen = document.getElementById('login-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('hud');
        
        const aliasInput = document.getElementById('alias-input');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const charNameDisplay = document.getElementById('char-name-display');
        const pauseBtn = document.getElementById('pause-btn');
        const pauseScreen = document.getElementById('pause-screen');
        const resumeBtn = document.getElementById('resume-btn');

        const CHARACTERS = [
            { name: 'Tomas', type: 'skater' },
            { name: 'Zombie', type: 'zombie' },
            { name: 'Tigre', type: 'tiger' },
            { name: 'Robot', type: 'gltf', modelKey: 'robot', color: null, rotY: 0 },
            { name: 'Leo', type: 'gltf', modelKey: 'soldier', color: 0xaf52de, rotY: Math.PI }
        ];
        let selectedCharIndex = 0;

        // --- PROCEDURAL CHARACTER BUILDERS ---
        function createSkater() {
            const group = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.6 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, roughness: 0.8 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x3366cc, roughness: 0.9 });
            const shoeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 });
            const boardMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7 });
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4 });
            const capMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

            const board = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 1.8), boardMat);
            board.position.y = 0.15; group.add(board);
            
            const w1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), wheelMat);
            w1.rotation.z = Math.PI/2; w1.position.set(0, 0.1, 0.6); group.add(w1);
            const w2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), wheelMat);
            w2.rotation.z = Math.PI/2; w2.position.set(0, 0.1, -0.6); group.add(w2);

            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.6, 0.25), pantsMat);
            legL.position.set(-0.2, 0.5, 0); group.add(legL);
            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.6, 0.25), pantsMat);
            legR.position.set(0.2, 0.5, 0); group.add(legR);
            
            const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.4), shoeMat);
            shoeL.position.set(-0.2, 0.25, 0.05); group.add(shoeL);
            const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.4), shoeMat);
            shoeR.position.set(0.2, 0.25, 0.05); group.add(shoeR);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.4), shirtMat);
            torso.position.set(0, 1.2, 0); group.add(torso);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), skinMat);
            armL.position.set(-0.45, 1.2, 0); group.add(armL);
            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), skinMat);
            armR.position.set(0.45, 1.2, 0); group.add(armR);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
            head.position.set(0, 1.85, 0); group.add(head);
            
            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.15, 0.52), capMat);
            cap.position.set(0, 2.15, 0); group.add(cap);
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.05, 0.3), capMat);
            visor.position.set(0, 2.1, 0.35); group.add(visor);

            group.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            group.userData = { type: 'skater', armL, armR, legL, legR, w1, w2 };
            return group;
        }

        function createZombie() {
            const group = new THREE.Group();
            
            const skinMat = new THREE.MeshStandardMaterial({ color: 0x557755, roughness: 0.9 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: 0x554444, roughness: 1.0 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 1.0 });
            const sawBodyMat = new THREE.MeshStandardMaterial({ color: 0xdd8800, roughness: 0.5, metalness: 0.3 });
            const sawBladeMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.4, metalness: 0.8 });
            const bloodMat = new THREE.MeshStandardMaterial({ color: 0x880000, roughness: 0.8 });

            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), pantsMat);
            legL.position.set(-0.25, 0.35, -0.1); legL.rotation.x = 0.1; group.add(legL);
            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), pantsMat);
            legR.position.set(0.25, 0.35, 0.1); legR.rotation.x = -0.1; group.add(legR);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.35), shirtMat);
            torso.position.set(0, 1.1, 0.1); torso.rotation.x = 0.2; group.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
            head.position.set(0, 1.65, 0.2); head.rotation.z = 0.2; head.rotation.x = 0.2; group.add(head);

            const eye = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.05), bloodMat);
            eye.position.set(0.12, 1.7, 0.46); group.add(eye);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), skinMat);
            armL.position.set(-0.45, 1.2, 0.4); armL.rotation.x = -1.2; group.add(armL);

            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.2), skinMat);
            armR.position.set(0.45, 1.0, 0.3); armR.rotation.x = -0.5; group.add(armR);

            const chainsaw = new THREE.Group();
            const sawBody = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.6), sawBodyMat);
            chainsaw.add(sawBody);
            const sawBlade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.8), sawBladeMat);
            sawBlade.position.set(0, -0.1, 0.7); chainsaw.add(sawBlade);
            chainsaw.position.set(0.45, 0.7, 0.6); chainsaw.rotation.x = -0.2;
            group.add(chainsaw);

            group.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            group.userData = { type: 'zombie', armL, armR, legL, legR, chainsaw, torso };
            return group;
        }

        function createArmoredTiger() {
            const group = new THREE.Group();
            
            const furMat = new THREE.MeshStandardMaterial({ color: 0xff8c00, roughness: 0.9 });
            const stripeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1.0 });
            const armorMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2, metalness: 0.9 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 });
            
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.5), armorMat);
            torso.position.set(0, 1.0, 0); group.add(torso);
            const chestPlate = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), goldMat);
            chestPlate.position.set(0, 1.1, 0.05); group.add(chestPlate);

            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.3), armorMat);
            legL.position.set(-0.25, 0.3, 0); group.add(legL);
            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.3), armorMat);
            legR.position.set(0.25, 0.3, 0); group.add(legR);

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), armorMat);
            armL.position.set(-0.55, 1.1, 0); group.add(armL);
            const armR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), armorMat);
            armR.position.set(0.55, 1.1, 0); group.add(armR);

            const headGroup = new THREE.Group();
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), furMat);
            headGroup.add(head);
            const snout = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.2), stripeMat);
            snout.position.set(0, -0.1, 0.35); headGroup.add(snout);
            const earL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.1), furMat);
            earL.position.set(-0.25, 0.3, 0); headGroup.add(earL);
            const earR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.1), furMat);
            earR.position.set(0.25, 0.3, 0); headGroup.add(earR);
            const helmet = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.2, 0.65), goldMat);
            helmet.position.set(0, 0.2, 0); headGroup.add(helmet);

            headGroup.position.set(0, 1.7, 0); group.add(headGroup);

            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.6, 0.1), furMat);
            tail.position.set(0, 0.7, -0.3); tail.rotation.x = -0.5; group.add(tail);

            group.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
            group.userData = { type: 'tiger', armL, armR, legL, legR, tail, headGroup };
            return group;
        }

        // --- THREE.JS SETUP ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        
        const assets = { train: null, car: null };
        const charModels = { soldier: null, robot: null };
        const charAnims  = { soldier: [], robot: [] };
        const gltfLoader = new THREE.GLTFLoader();

        function loadCharModel(url, key) {
            gltfLoader.load(url, gltf => {
                charModels[key] = gltf.scene;
                charAnims[key]  = gltf.animations || [];
                charModels[key].traverse(n => {
                    if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; }
                });
                if (CHARACTERS[selectedCharIndex].modelKey === key) setupLoginCharPreview(selectedCharIndex);
            }, undefined, () => {});
        }

        function loadAsset(url, key, scale) {
            gltfLoader.load(url, gltf => {
                assets[key] = gltf.scene;
                if (scale) assets[key].scale.set(scale, scale, scale);
            }, undefined, () => {});
        }

        loadCharModel('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/Soldier.glb', 'soldier');
        loadCharModel('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/gltf/RobotExpressive/RobotExpressive.glb', 'robot');
        loadAsset('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb', 'car', 0.5);
        
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 40, 150); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, -8);
        camera.lookAt(0, 2, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(-10, 20, -10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.near = 0.1;
        dirLight.shadow.camera.far = 200;
        scene.add(dirLight);

        // --- ENVIRONMENT INFINITO ---
        const trackGroup = new THREE.Group();
        scene.add(trackGroup);

        // Suelo central (gravilla/vías)
        const trackFloorGeo = new THREE.PlaneGeometry(12, 800);
        const trackFloorMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
        const trackFloor = new THREE.Mesh(trackFloorGeo, trackFloorMat);
        const asphaltGeo = new THREE.PlaneGeometry(800, 800);
        const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 }); // Asfalto oscuro
        const asphaltFloor = new THREE.Mesh(asphaltGeo, asphaltMat);
        asphaltFloor.rotation.x = -Math.PI / 2;
        asphaltFloor.position.y = -0.05; 
        asphaltFloor.position.z = 300;
        asphaltFloor.receiveShadow = true;
        trackGroup.add(asphaltFloor);

        // Veredas (Aceras) a los costados
        const sidewalkGeo = new THREE.BoxGeometry(20, 0.2, 800);
        const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
        
        const sidewalkLeft = new THREE.Mesh(sidewalkGeo, sidewalkMat);
        sidewalkLeft.position.set(-15, 0.05, 300);
        sidewalkLeft.receiveShadow = true;
        trackGroup.add(sidewalkLeft);

        const sidewalkRight = new THREE.Mesh(sidewalkGeo, sidewalkMat);
        sidewalkRight.position.set(15, 0.05, 300);
        sidewalkRight.receiveShadow = true;
        trackGroup.add(sidewalkRight);

        function createTrack(x) {
            // Vías de tren
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.2 });
            const railGeo = new THREE.BoxGeometry(0.2, 0.1, 800);
            
            const rail1 = new THREE.Mesh(railGeo, trackMat);
            rail1.position.set(x - 0.8, 0.05, 300);
            rail1.receiveShadow = true;
            trackGroup.add(rail1);
            
            const rail2 = new THREE.Mesh(railGeo, trackMat);
            rail2.position.set(x + 0.8, 0.05, 300);
            rail2.receiveShadow = true;
            trackGroup.add(rail2);

            const tieGeo = new THREE.BoxGeometry(2.5, 0.08, 0.4);
            const tieMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });

            cx.strokeRect(10, 10, 492, 236);

        function createTrain() {
            const group = new THREE.Group();

            if (assets.train) {
                const trainModel = assets.train.clone();
                
                // 1. Resetear cualquier escala/rotación previa para medir bien
                trainModel.scale.set(1, 1, 1);
                trainModel.rotation.set(0, 0, 0);

                // 2. Medir las dimensiones reales del modelo 3D
                let box = new THREE.Box3().setFromObject(trainModel);
                let size = box.getSize(new THREE.Vector3());
                
                // 3. Si el tren es más ancho que largo, significa que está atravesado. Lo rotamos.
                if (size.x > size.z) {
                    trainModel.rotation.y = Math.PI / 2;
                    box = new THREE.Box3().setFromObject(trainModel); // Recalcular medidas
                    size = box.getSize(new THREE.Vector3());
                }
                
                // 4. Calcular el factor de escala para que el ancho encaje perfecto en el carril (2.4 unidades)
                const scaleFactor = 2.4 / size.x;
                trainModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
                
                // 5. Inyectar colores aleatorios a la carrocería del tren
                const colorHex = config.trainColors[Math.floor(Math.random() * config.trainColors.length)];
                trainModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        // Heurística: Si el material es claro (no es rueda o ventana negra), pintarlo
                        // Creamos un color de Three para comparar su claridad (brillo)
                        let matColor = child.material.color || new THREE.Color(0xffffff);
                        if (matColor.r > 0.2 || matColor.g > 0.2 || matColor.b > 0.2) {
                            child.material = child.material.clone();
                            child.material.color.setHex(colorHex);
                        }
                    }
                });

                // 6. Medir la altura final y ajustar la posición para que toque el suelo
                box = new THREE.Box3().setFromObject(trainModel);
                const finalHeight = box.max.y - box.min.y;
                trainModel.position.y = -box.min.y; // Elevar si el origen del modelo está mal centrado

                group.add(trainModel);
                
                // 6. Asignar la altura dinámica para que Tomás pueda correr exactamente por el techo
                group.userData = { type: 'train', height: finalHeight };
                return group;
            }

            // === METRO MODERNO ===
            const color = config.trainColors[Math.floor(Math.random() * config.trainColors.length)];

            // Cuerpo principal
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.25, metalness: 0.4 });
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.7, 2.4, 9.5), bodyMat);
            body.position.y = 1.8;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Techo oscuro

                new THREE.BoxGeometry(2.5, 0.3, 9.3),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 })
            );
            roof.position.y = 3.15;
            group.add(roof);

            // Franja inferior negra
            const skirt = new THREE.Mesh(
                new THREE.BoxGeometry(2.75, 0.35, 9.6),
                new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
            );
            skirt.position.y = 0.68;
            group.add(skirt);

            // Franja blanca horizontal (logo de metro)
            const stripe = new THREE.Mesh(
                new THREE.BoxGeometry(2.72, 0.1, 9.52),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            stripe.position.y = 1.45;
            group.add(stripe);

            // Ventanas laterales (vidrio azulado)
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x99ccee, metalness: 0.8, roughness: 0.05 });
            [-1.8, -0.6, 0.6, 1.8].forEach(z => {
                const wL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.75), glassMat);
                wL.position.set(-1.37, 2.15, z);
                group.add(wL);
                const wR = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.75), glassMat);
                wR.position.set(1.37, 2.15, z);
                group.add(wR);
            });

            // Cara frontal: ventana grande
            const frontWin = new THREE.Mesh(
                new THREE.BoxGeometry(1.7, 0.85, 0.06),
                new THREE.MeshStandardMaterial({ color: 0x88bbdd, metalness: 0.9, roughness: 0.05 })
            );
            frontWin.position.set(0, 2.25, -4.78);
            group.add(frontWin);

            // Panel de destino (display LED)
            const dest = new THREE.Mesh(
                new THREE.BoxGeometry(1.4, 0.22, 0.06),
                new THREE.MeshBasicMaterial({ color: 0xffee44 })
            );
            dest.position.set(0, 2.9, -4.78);
            group.add(dest);

            // Faros (rectangulares, modernos)
            const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            [-0.9, 0.9].forEach(x => {
                const hl = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.18, 0.06), hlMat);
                hl.position.set(x, 1.05, -4.78);
                group.add(hl);

                new THREE.BoxGeometry(2.8, 0.28, 8.4),

            group.add(bogie);

        function spawnObject(zPos) {
            const laneIndex = Math.floor(Math.random() * 3);
            const xPos = config.lanes[laneIndex];
            
            const rand = Math.random();
            let obj;

            if (rand > 0.6) {
                obj = createTrain();
                obj.position.set(xPos, 0, zPos);
                
                if (Math.random() > 0.7) { // 30% chance to be a moving train
                    obj.userData.isMoving = true;
                    obj.userData.vz = -(20 + Math.random() * 15);
                } else {
                    obj.userData.isMoving = false;
                    obj.userData.vz = 0;
                    if(Math.random() > 0.3) {
                        for(let i=0; i<3; i++) {
                            let item = Math.random() > 0.85 ? createStar() : createCoin();
                            item.position.set(xPos, obj.userData.height + 0.6, zPos + i*2 - 2);
                            objectPool.add(item);
                            activeObjects.push(item);
                        }
                    }
                }
            } else if (rand > 0.3) {
                obj = createBarrier();
                obj.position.set(xPos, 0, zPos);
            } else {
                for(let i=0; i<3; i++) {
                    let item = Math.random() > 0.85 ? createStar() : createCoin();
                    item.position.set(xPos, 1, zPos + i*2);
                    objectPool.add(item);
                    activeObjects.push(item);
                }
                return;
            }

            objectPool.add(obj);
            activeObjects.push(obj);
        }

        // --- INPUT ---
        window.addEventListener('keydown', (e) => {
            if (!state.isPlaying) return;

            if (e.key === ' ' || e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
            }

            if (e.key === 'ArrowLeft' && state.playerLane > 0) {
                state.playerLane--;
            } else if (e.key === 'ArrowRight' && state.playerLane < 2) {
                state.playerLane++;
            } else if ((e.key === 'ArrowUp' || e.key === ' ' || e.code === 'Space') && !state.isJumping) {
                state.playerVelocityY = config.jumpForce;
                state.isJumping = true;
                state.isOnTrain = false;
            } else if (e.key === 'ArrowDown') {
                if (state.isJumping) {
                    state.playerVelocityY = -60; // Caída rápida
                } else if (!state.isDucking) {
                    state.isDucking = true;
                    state.duckTimer = 0.8; // Tiempo agachado
                }
            }
            state.targetX = config.lanes[state.playerLane];
        });

        // --- TOUCH INPUT (MÓVIL) ---
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        window.addEventListener('touchmove', e => {
            if (state.isPlaying) e.preventDefault(); // Evitar scroll
        }, { passive: false });

        window.addEventListener('touchend', e => {
            if (!state.isPlaying) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const xDiff = touchEndX - touchStartX;
            const yDiff = touchEndY - touchStartY;

            if (Math.abs(xDiff) > Math.abs(yDiff)) { // Horizontal
                if (Math.abs(xDiff) > 30) {
                    if (xDiff > 0 && state.playerLane < 2) state.playerLane++;
                    else if (xDiff < 0 && state.playerLane > 0) state.playerLane--;
                    state.targetX = config.lanes[state.playerLane];
                }
            } else { // Vertical
                if (Math.abs(yDiff) > 30) {
                    if (yDiff < 0 && !state.isJumping) {
                        state.playerVelocityY = config.jumpForce;
                        state.isJumping = true;
                        state.isOnTrain = false;
                    } else if (yDiff > 0) {
                        if (state.isJumping) state.playerVelocityY = -60;
                        else if (!state.isDucking) {
                            state.isDucking = true;
                            state.duckTimer = 0.8;
                        }
                    }
                }
            }
        }, { passive: false });

        // --- LOGIC ---
        let lastTime = 0;
        let spawnTimer = 0;
        let spawnSceneryTimer = 0;

        function getCharacterModel(idx) {
            const char = CHARACTERS[idx];
            if (char.type === 'skater') return createSkater();
            if (char.type === 'zombie') return createZombie();
            if (char.type === 'tiger') return createArmoredTiger();
            
            // GLTF Models
            if (char.type === 'gltf') {
                const group = new THREE.Group();
                const src = charModels[char.modelKey];
                if (src) {
                    const cloned = src.clone();
                    cloned.traverse(n => {
                        if (n.isMesh && n.material) {
                            n.material = n.material.clone();
                            // Si es soldado violeta, dar un tinte sin perder la textura
                            if (char.color !== null) {
                                n.material.color.setHex(0xffffff); // reset
                                n.material.color.lerp(new THREE.Color(char.color), 0.5);
                            }
                        }
                    });
                    cloned.scale.set(1, 1, 1);
                    const bb = new THREE.Box3().setFromObject(cloned);
                    const h = bb.max.y - bb.min.y;
                    const s = 1.8 / Math.max(h, 0.1);
                    cloned.scale.set(s, s, s);
                    cloned.rotation.y = char.rotY;
                    group.add(cloned);

                    const anims = charAnims[char.modelKey];
                    if (anims && anims.length > 0) {
                        const mixer = new THREE.AnimationMixer(cloned);
                        let runAnim = anims[0];
                        anims.forEach(a => { if (a.name.toLowerCase().includes('run')) runAnim = a; });
                        group.userData = { type: 'gltf', mixer, runAction: mixer.clipAction(runAnim) };
                        group.userData.runAction.play();
                    }
                }
                return group;
            }
            return createSkater(); // fallback
        }

        function applyCharacterToPlayer() {
            while (playerGroup.children.length > 0) playerGroup.remove(playerGroup.children[0]);
            if (playerGroup.userData && playerGroup.userData.mixer) {
                playerGroup.userData.mixer.stopAllAction();
            }
            
            const model = getCharacterModel(selectedCharIndex);
            
            // Ajustar el grupo entero
            if (CHARACTERS[selectedCharIndex].type !== 'gltf') {
                model.rotation.y = Math.PI; // Para que mire hacia adelante (en -z)
            }
            playerGroup.add(model);
            playerGroup.userData = model.userData;
        }


        function updateHUD() {
            document.getElementById('hud-score').innerText = Math.floor(state.score);
            document.getElementById('hud-coins').innerText = state.coins;
            
            const livesEl = document.getElementById('hud-lives');
            livesEl.innerHTML = '';
            for(let i=0; i<state.lives; i++) {
                livesEl.innerHTML += '<span class="heart">❤️</span>';
            }

            if (state.monsterActive) {
                document.getElementById('hud-monster').classList.remove('hidden');
                document.getElementById('hud-monster-life').innerText = state.monsterLife;
            } else {
                document.getElementById('hud-monster').classList.add('hidden');
            }
        }

        function loseLife() {
            if (state.isInvincible) return;

            state.lives--;
            // NO reiniciar monstersDefeated para que no vuelva al monstruo 1
            // Si el jefe estaba activo, lo escondemos un rato para dar respiro
            if (state.monsterActive) {
                state.monsterActive = false;
                monsterGroup.visible = false;
                state.monsterTimer = 5; // Darle 5 segundos de paz
            }
            updateHUD();

            if (state.lives <= 0) {
                gameOver();
            } else {
                state.isInvincible = true;
                state.invincibleTimer = 1.0; 
            }
        }

        function gameOver() {
            state.isPlaying = false;
            if (state.score > state.maxScore) {
                state.maxScore = Math.floor(state.score);
                localStorage.setItem('tomasSurferMaxScore', state.maxScore);
            }
            
            document.getElementById('final-score-display').innerText = `Puntos: ${Math.floor(state.score)} | Monedas: ${state.coins}`;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            state.score = 0;
            state.scoreWithoutMistakes = 0;
            state.coins = 0;
            state.lives = 3;
            state.speed = config.speedBase;
            state.distance = 0;
            state.playerLane = 1;
            state.targetX = config.lanes[1];
            state.isJumping = false;
            state.isDucking = false;
            state.duckTimer = 0;
            state.playerVelocityY = 0;
            state.isOnTrain = false;
            state.isInvincible = false;
            state.monsterActive = false;
            state.monsterTimer = 0;
            state.monsterType = 0;
            state.monsterLife = 0;
            state.monstersDefeated = 0;
            monsterGroup.visible = false;
            playerGroup.scale.y = 1.0;
            
            // Quitar el personaje del login de la escena
            if (loginCharGroup) { scene.remove(loginCharGroup); loginCharGroup = null; }
            if (loginCharMixer) { loginCharMixer.stopAllAction(); loginCharMixer = null; }
            applyCharacterToPlayer();
            playerGroup.position.set(state.targetX, 0, 0);
            camera.position.set(0, 5, -8);
            trackGroup.position.z = 0;

            activeObjects.forEach(obj => objectPool.remove(obj));
            activeObjects.length = 0;

            activeScenery.forEach(obj => sceneryGroup.remove(obj));
            activeScenery.length = 0;

            for(let i = 40; i < 200; i += 30) {
                spawnObject(i);
            }

            for(let i = -20; i < 400; i += 20) {
                spawnScenery(i);
                if (Math.random() > 0.5) spawnScenery(i + Math.random() * 10);
            }

            // Cartel fijo directamente en la escena (no en sceneryGroup para que no se borre)
            if (fixedBillboard) scene.remove(fixedBillboard);
            fixedBillboard = createBillboard();
            fixedBillboard.position.set(9, 0, 35);
            fixedBillboard.rotation.y = Math.PI / 10;
            scene.add(fixedBillboard);

            document.getElementById('hud-alias').innerText = state.alias;
            document.getElementById('hud-max-score').innerText = state.maxScore;
            updateHUD();
            pauseBtn.classList.remove('hidden');
        }

        pauseBtn.addEventListener('click', () => {
            if (state.isPlaying && !state.isPaused) {
                state.isPaused = true;
                pauseScreen.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
            }
        });

        resumeBtn.addEventListener('click', () => {
            if (state.isPlaying && state.isPaused) {
                state.isPaused = false;
                pauseScreen.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                lastTime = performance.now(); // evitar saltos de tiempo
            }
        });

        function animate(time) {
            requestAnimationFrame(animate);

            const delta = (time - lastTime) / 1000;
            lastTime = time;

            if (!state.isPlaying) {
                // Cámara frontal para ver el personaje en el selector
                camera.position.set(0, 1.6, 3.2);
                camera.lookAt(0, 0.9, 0);
                const dt = Math.min(delta, 0.1);
                
                if (loginCharGroup && loginCharGroup.userData && loginCharGroup.userData.mixer) {
                    loginCharGroup.userData.mixer.update(dt);
                }
                
                if (loginCharGroup) loginCharGroup.rotation.y += 0.012;
                renderer.render(scene, camera);
                return;
            }

            if (state.isPaused) {
                return; // no avanzar la lógica del juego
            }

            state.speed = Math.min(config.speedMax, config.speedBase + (state.distance * 0.005));
            const moveZ = state.speed * delta;
            state.distance += moveZ;
            state.score += moveZ * 0.1;
            state.scoreWithoutMistakes += moveZ * 0.1;

            playerGroup.position.z += moveZ;
            
            // --- CÁMARA ESTILO GTA (Tercera persona dinámica) ---
            // La cámara sigue al jugador de cerca y más bajo
            camera.position.z = playerGroup.position.z - 7.5;
            camera.position.y = 3.8 + (playerGroup.position.y * 0.2); // Sube un poco si el jugador salta
            camera.position.x = playerGroup.position.x * 0.4; // Se desplaza un poco lateralmente
            
            // La cámara mira un punto lejano adelante del jugador para dar perspectiva
            const lookTarget = new THREE.Vector3(
                playerGroup.position.x * 0.2, 
                playerGroup.position.y + 1.5, 
                playerGroup.position.z + 18
            );
            camera.lookAt(lookTarget);

            // Hacer que la luz siga al jugador para que las sombras no se corten
            dirLight.position.z = playerGroup.position.z - 10;
            dirLight.target.position.z = playerGroup.position.z;
            dirLight.target.updateMatrixWorld();

            // Ilusión infinita para las vías (Evita que desaparezcan)
            // Cuando avanzamos 100 unidades, movemos todo el bloque de vías 100 hacia adelante
            const snapZ = Math.floor(playerGroup.position.z / 100) * 100;
            trackGroup.position.z = snapZ;

            playerGroup.position.x += (state.targetX - playerGroup.position.x) * 12 * delta;

            if (state.isJumping || playerGroup.position.y > state.groundY) {
                state.playerVelocityY += config.gravity * delta;
                playerGroup.position.y += state.playerVelocityY * delta;

                if (playerGroup.position.y <= state.groundY) {
                    playerGroup.position.y = state.groundY;
                    state.isJumping = false;
                    state.playerVelocityY = 0;
                }
            } else {
                playerGroup.position.y = state.groundY;
            }

            // Animación y lógica de agacharse
            if (state.isDucking) {
                state.duckTimer -= delta;
                playerGroup.scale.y = 0.5; // Achicar personaje a la mitad
                if (state.duckTimer <= 0) {
                    state.isDucking = false;
                    playerGroup.scale.y = 1.0;
                }
            } else {
                playerGroup.scale.y = 1.0;
            }

            // Animaciones personalizadas
            const uData = playerGroup.userData;
            const type = uData.type;

            if (!state.isJumping && state.groundY === playerGroup.position.y) {
                const runCycle = Math.sin(time * 0.015);
                
                if (type === 'gltf' && uData.mixer) {
                    uData.mixer.update(delta);
                } else if (type === 'skater') {
                    uData.armL.rotation.x = runCycle * 0.5;
                    uData.armR.rotation.x = -runCycle * 0.5;
                    // En patineta las piernas no se mueven tanto
                    uData.w1.rotation.y += 20 * delta;
                    uData.w2.rotation.y += 20 * delta;
                } else if (type === 'zombie') {
                    // Zombie camina torpe
                    uData.legL.rotation.x = runCycle * 0.6 + 0.1;
                    uData.legR.rotation.x = -runCycle * 0.6 - 0.1;
                    uData.torso.rotation.z = Math.sin(time * 0.005) * 0.1;
                    uData.chainsaw.position.y = 0.7 + Math.random() * 0.05; // Tiembla
                } else if (type === 'tiger') {
                    uData.armL.rotation.x = runCycle * 0.7;
                    uData.armR.rotation.x = -runCycle * 0.7;
                    uData.legL.rotation.x = -runCycle * 0.7;
                    uData.legR.rotation.x = runCycle * 0.7;
                    uData.tail.rotation.z = Math.sin(time * 0.01) * 0.3;
                    uData.headGroup.rotation.y = Math.sin(time * 0.005) * 0.2;
                }
            } else {
                // Posición de salto
                if (type === 'skater') {
                    uData.armL.rotation.x = -1.5; uData.armR.rotation.x = -1.5;
                } else if (type === 'zombie') {
                    uData.legL.rotation.x = -0.5; uData.legR.rotation.x = -0.5;
                } else if (type === 'tiger') {
                    uData.armL.rotation.x = -0.8; uData.armR.rotation.x = -0.8;
                    uData.legL.rotation.x = 0.5; uData.legR.rotation.x = 0.5;
                }
            }

            playerBox.setFromObject(playerGroup);
            playerBox.expandByScalar(-0.15);

            if (state.isInvincible) {
                state.invincibleTimer -= delta;
                const visible = Math.floor(time / 100) % 2 === 0;
                playerGroup.children.forEach(child => child.visible = visible);
                
                if (state.invincibleTimer <= 0) {
                    state.isInvincible = false;
                    playerGroup.children.forEach(child => child.visible = true);
                }
            }

            let nextGroundY = 0;
            let onTrainThisFrame = false;

            
                let obj = activeObjects[i];

                if (obj.userData.type === 'coin' || obj.userData.type === 'star') {
                   // --- CÓDIGO CORREGIDO DE COLISIONES Y SUELO ---
            playerBox.setFromObject(playerGroup);
            playerBox.expandByScalar(-0.15); // Hace la colisión más justa

            let nextGroundY = 0;
            let onTrainThisFrame = false;

            for (let i = activeObjects.length - 1; i >= 0; i--) {
                let obj = activeObjects[i];
                let objBox = new THREE.Box3().setFromObject(obj);

                if (playerBox.intersectsBox(objBox)) {
                    const tipo = obj.userData.type;

                    // 1. Si es moneda o estrella
                    if (tipo === 'coin' || tipo === 'star') {
                        if (tipo === 'coin') state.coins++;
                        else {
                            state.score += 50;
                            if (state.monsterActive) state.monsterLife--;
                        }
                        updateHUD();
                        objectPool.remove(obj);
                        activeObjects.splice(i, 1);
                        continue;
                    }

                    // 2. Si es un tren: chequeamos si estamos arriba o chocamos de frente
                    if (tipo === 'train') {
                        if (playerGroup.position.y > 1.5) {
                            nextGroundY = obj.userData.height; // El techo del tren es el nuevo suelo
                            onTrainThisFrame = true;
                        } else {
                            loseLife(); // Choque frontal
                        }
                    } else {
                        loseLife(); // Choque con otros obstáculos (rocas, barreras)
                    }
                }

                // Borrar objetos que ya quedaron atrás (limpieza de memoria)
                if (obj.position.z < playerGroup.position.z - 20) {
                    objectPool.remove(obj);
                    activeObjects.splice(i, 1);
                }
            }

            // APLICAR EL SUELO: Si detectamos que estamos sobre un tren, fijamos esa altura
            if (onTrainThisFrame) {
                state.groundY = nextGroundY;
                state.isOnTrain = true;
            } else {
                state.groundY = 0; // Volvemos al suelo de la calle
            }
            // --- Lógica de Monstruos ---
            if (!state.monsterActive) {
                if (state.monstersDefeated === 0 && state.score > 300) {
                    state.monsterActive = true;
                    state.monsterType = 1;
                    state.monsterLife = 3; // Menos vida para que sea posible ganarle
                    rockMonsterMesh.visible = true;
                    tentacleMonsterMesh.visible = false;
                    ufoMonsterMesh.visible = false;
                    monsterGroup.visible = true;
                    monsterGroup.position.set(0, 8, playerGroup.position.z + 100);
                    updateHUD();
                } else if (state.monstersDefeated === 1 && state.score > 800) { 
                    state.monsterActive = true;
                    state.monsterType = 2;
                    state.monsterLife = 5;
                    rockMonsterMesh.visible = false;
                    tentacleMonsterMesh.visible = true;
                    ufoMonsterMesh.visible = false;
                    monsterGroup.visible = true;
                    monsterGroup.position.set(0, 8, playerGroup.position.z + 100);
                    updateHUD();
                } else if (state.monstersDefeated === 2 && state.score > 1500) {
                    state.monsterActive = true;
                    state.monsterType = 3;
                    state.monsterLife = 7;
                    rockMonsterMesh.visible = false;
                    tentacleMonsterMesh.visible = false;
                    ufoMonsterMesh.visible = true;
                    monsterGroup.visible = true;
                    monsterGroup.position.set(0, 8, playerGroup.position.z + 100);
                    updateHUD();
                }
            }

            if (state.monsterActive) {
                monsterGroup.position.z = playerGroup.position.z + 80;
                monsterGroup.position.x = Math.sin(time * 0.003) * 3;
                monsterGroup.position.y = 8 + Math.sin(time * 0.005) * 1;
                
                if (state.monsterType === 1) {
                    rockMonsterMesh.children[3].rotation.x = Math.sin(time * 0.01);
                    rockMonsterMesh.children[4].rotation.x = -Math.sin(time * 0.01);
                } else if (state.monsterType === 2) {
                    for(let i=2; i<6; i++) {
                        tentacleMonsterMesh.children[i].rotation.x = Math.PI/4 * Math.sin(i + time*0.01);
                        tentacleMonsterMesh.children[i].rotation.z = Math.PI/4 * Math.cos(i + time*0.01);
                    }
                } else if (state.monsterType === 3) {
                    ufoMonsterMesh.rotation.y += 5 * delta;
                }

                state.monsterTimer -= delta;
                if (state.monsterTimer <= 0) {
                    if (state.monsterType === 1) {
                        state.monsterTimer = 2 + Math.random() * 2; 
                        spawnRock(monsterGroup.position.x, monsterGroup.position.z);
                    } else if (state.monsterType === 2) {
                        state.monsterTimer = 1 + Math.random() * 1.5; 
                        spawnSlime(monsterGroup.position.x, monsterGroup.position.z);
                    } else if (state.monsterType === 3) {
                        state.monsterTimer = 0.8 + Math.random() * 1; 
                        spawnVehicle(monsterGroup.position.x, monsterGroup.position.z);
                    }
                }
            }

            spawnTimer -= delta * state.speed;
            if (spawnTimer <= 0) {
                spawnObject(playerGroup.position.z + 150 + Math.random() * 50);
                spawnTimer = 20 + Math.random() * 20; 
            }

            spawnSceneryTimer -= delta * state.speed;
            if (spawnSceneryTimer <= 0) {
                spawnScenery(playerGroup.position.z + 250 + Math.random() * 50);
                if (Math.random() > 0.5) spawnScenery(playerGroup.position.z + 250 + Math.random() * 50);
                spawnSceneryTimer = 8 + Math.random() * 10; 
            }

            for (let i = activeScenery.length - 1; i >= 0; i--) {
                let obj = activeScenery[i];
                if (obj.position.z < playerGroup.position.z - 30) {
                    sceneryGroup.remove(obj);
                    activeScenery.splice(i, 1);
                }
            }

            if (Math.floor(time) % 500 === 0) updateHUD();

            renderer.render(scene, camera);
        }

        // ---- PREVIEW DE PERSONAJE EN LA ESCENA PRINCIPAL ----
        // El modelo 3D real gira en el mundo Three.js durante el login.
        // El diálogo es semi-transparente → el personaje se ve detrás.
        let loginCharGroup = null;
        let loginCharMixer = null;

        function setupLoginCharPreview(idx) {
            if (loginCharGroup) { scene.remove(loginCharGroup); loginCharGroup = null; }

            const model = getCharacterModel(idx);
            loginCharGroup = model;
            loginCharGroup.position.set(0, 0, 0);
            scene.add(loginCharGroup);
            
            // Animación idle se hace en animate()
            loginCharGroup.userData.isLogin = true;
        }

        document.getElementById('prev-char').addEventListener('click', () => {
            selectedCharIndex = (selectedCharIndex - 1 + CHARACTERS.length) % CHARACTERS.length;
            charNameDisplay.innerText = CHARACTERS[selectedCharIndex].name;
            setupLoginCharPreview(selectedCharIndex);
        });

        document.getElementById('next-char').addEventListener('click', () => {
            selectedCharIndex = (selectedCharIndex + 1) % CHARACTERS.length;
            charNameDisplay.innerText = CHARACTERS[selectedCharIndex].name;
            setupLoginCharPreview(selectedCharIndex);
        });

        setupLoginCharPreview(0);

        startBtn.addEventListener('click', () => {
            const alias = aliasInput.value.trim() || 'Guest';
            state.alias = alias;
            loginScreen.classList.add('hidden');
            hud.classList.remove('hidden');

            resetGame();
            state.isPlaying = true;
        });

        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            resetGame();
            state.isPlaying = true;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);

    </script>
